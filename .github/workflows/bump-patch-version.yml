name: Bump Patch Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number with patch (e.g., 1.0.2 or 0.12.2)'
        required: true
        type: string

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Call update scripts
        run: |
          VERSION=${{ github.event.inputs.version }}
          .github/scripts/release-patch.sh $VERSION

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "version docs to ${{ github.event.inputs.version }}"
          add-paths: "**/*.ts"
          title: "chore: bump patch version ${{ github.event.inputs.version }}"
          body: |
            This PR updates the docs to version ${{ github.event.inputs.version }}.

            Before merging, complete the upgrade-guidance review in CONTRIBUTING.md:

            - [ ] Check Nightly upgrade entries against the target GreptimeDB release and record the release evidence below.
            - [ ] Move applicable entries into release-specific sections in both Nightly and versioned English/Chinese guides; update Nightly-only wording and related links. State the first applicable patch release for backports.
            - [ ] Keep unreleased features in Nightly only and exclude them from the target versioned guide.
            - [ ] Preserve published anchors and pass both strict locale link checks after updating the guides.

            Review outcome: <!-- List entries moved, retained as unreleased, or excluded, with release evidence; explicitly state if no changes are needed. -->
          branch: "version-docs-${{ github.event.inputs.version }}"
          base: main
          delete-branch: true
