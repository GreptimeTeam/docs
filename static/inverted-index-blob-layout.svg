<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">GreptimeDB inverted-index blob layout</title>
  <desc id="desc">An inverted-index blob stores one index for each indexed column, followed by a footer payload and its four-byte length. Each column index contains a null bitmap, posting bitmaps, and an FST that maps encoded values to bitmap ranges.</desc>
  <defs>
    <style>
      .group { font: 650 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .title { font: 650 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .label { font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .purple { fill: #6D28D9; }
      .teal { fill: #0F766E; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="#FFFFFF"/>

  <rect x="40" y="35" width="1120" height="175" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="70" y="72" class="group">Inverted-index blob</text>

  <rect x="80" y="100" width="165" height="70" rx="11" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="162.5" y="143" text-anchor="middle" class="mono">job</text>
  <rect x="265" y="100" width="165" height="70" rx="11" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="347.5" y="143" text-anchor="middle" class="mono">handler</text>
  <rect x="450" y="100" width="165" height="70" rx="11" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="532.5" y="143" text-anchor="middle" class="mono">status</text>
  <text x="650" y="143" text-anchor="middle" class="group">…</text>
  <rect x="690" y="100" width="260" height="70" rx="11" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2"/>
  <text x="820" y="130" text-anchor="middle" class="title teal">Footer</text>
  <text x="820" y="154" text-anchor="middle" class="small">offsets · sizes · metadata</text>
  <rect x="970" y="100" width="150" height="70" rx="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="1045" y="130" text-anchor="middle" class="label">Footer size</text>
  <text x="1045" y="154" text-anchor="middle" class="mono">4 bytes</text>

  <path d="M 162.5 180 L 162.5 235 L 300 235 L 300 250" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <path d="M 300 250 L 293 238 L 307 238 Z" fill="#7C3AED"/>

  <rect x="170" y="260" width="990" height="170" rx="17" fill="#FAFAFF" stroke="#C4B5FD" stroke-width="2.5"/>
  <text x="200" y="297" class="group">Column index</text>

  <rect x="200" y="330" width="150" height="62" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="275" y="368" text-anchor="middle" class="label">Null bitmap</text>
  <rect x="370" y="330" width="180" height="62" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="460" y="368" text-anchor="middle" class="label purple">Posting bitmap 0</text>
  <rect x="570" y="330" width="180" height="62" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="660" y="368" text-anchor="middle" class="label purple">Posting bitmap 1</text>
  <text x="785" y="369" text-anchor="middle" class="group">…</text>
  <rect x="820" y="330" width="160" height="62" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="900" y="368" text-anchor="middle" class="label purple">Posting bitmap n</text>
  <rect x="1000" y="330" width="130" height="62" rx="10" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2"/>
  <text x="1065" y="357" text-anchor="middle" class="title teal">FST</text>
  <text x="1065" y="380" text-anchor="middle" class="small">value → range</text>
</svg>
