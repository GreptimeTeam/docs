<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">GreptimeDB inverted-index blob layout</title>
  <desc id="desc">An inverted-index blob stored in a Puffin file contains one index for each indexed column followed by a footer payload and its four-byte size. Each column index contains a null bitmap, posting bitmaps, and an FST that maps encoded column values to bitmap byte ranges.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <style>
      .kicker { font: 650 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; text-transform: uppercase; fill: #64748B; }
      .headline { font: 650 31px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .title { font: 650 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .label { font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .purple { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6D28D9; }
      .teal { font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F766E; }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#FFFFFF"/>
  <text x="70" y="58" class="kicker">Puffin index blob</text>
  <text x="70" y="101" class="headline">One blob contains column indexes followed by footer metadata</text>
  <line x1="70" y1="126" x2="1430" y2="126" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="70" y="165" width="1360" height="245" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="105" y="207" class="title">Inverted-index blob</text>
  <text x="105" y="237" class="subtitle">stored as a typed blob in the SST's optional Puffin sidecar</text>

  <rect x="105" y="275" width="250" height="92" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="230" y="313" text-anchor="middle" class="title">Column index</text>
  <text x="230" y="343" text-anchor="middle" class="mono">job</text>
  <rect x="375" y="275" width="250" height="92" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="500" y="313" text-anchor="middle" class="title">Column index</text>
  <text x="500" y="343" text-anchor="middle" class="mono">handler</text>
  <rect x="645" y="275" width="250" height="92" rx="13" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="770" y="313" text-anchor="middle" class="title">Column index</text>
  <text x="770" y="343" text-anchor="middle" class="mono">status</text>
  <text x="925" y="331" text-anchor="middle" class="headline">…</text>
  <rect x="970" y="275" width="270" height="92" rx="13" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2.5"/>
  <text x="1105" y="313" text-anchor="middle" class="title">Footer payload</text>
  <text x="1105" y="343" text-anchor="middle" class="teal">offsets · sizes · index metadata</text>
  <rect x="1260" y="275" width="135" height="92" rx="13" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="1327.5" y="312" text-anchor="middle" class="label">Footer size</text>
  <text x="1327.5" y="344" text-anchor="middle" class="mono">4 bytes</text>

  <path d="M230 367 C230 440, 310 435, 310 485" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="260" y="449" class="purple">expand one column</text>

  <rect x="250" y="485" width="1180" height="205" rx="18" fill="#FAFAFF" stroke="#C4B5FD" stroke-width="2.5"/>
  <text x="285" y="528" class="title">Column index layout</text>
  <text x="285" y="558" class="subtitle">values are encoded in byte order; the FST points to their posting bitmaps</text>

  <rect x="285" y="590" width="190" height="62" rx="11" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="380" y="628" text-anchor="middle" class="label">Null bitmap</text>
  <rect x="495" y="590" width="190" height="62" rx="11" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="590" y="617" text-anchor="middle" class="label">Posting bitmap 0</text>
  <text x="590" y="640" text-anchor="middle" class="small">segments for value 0</text>
  <rect x="705" y="590" width="190" height="62" rx="11" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="800" y="617" text-anchor="middle" class="label">Posting bitmap 1</text>
  <text x="800" y="640" text-anchor="middle" class="small">segments for value 1</text>
  <text x="935" y="630" text-anchor="middle" class="headline">…</text>
  <rect x="975" y="590" width="210" height="62" rx="11" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1080" y="621" text-anchor="middle" class="label">Posting bitmap n</text>
  <rect x="1205" y="590" width="190" height="62" rx="11" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2.5"/>
  <text x="1300" y="617" text-anchor="middle" class="title">FST</text>
  <text x="1300" y="641" text-anchor="middle" class="small">value → bitmap range</text>

  <line x1="70" y1="724" x2="1430" y2="724" stroke="#E2E8F0" stroke-width="2"/>
  <text x="70" y="759" class="label">There is no separate inverted-index header; the footer describes how to locate and decode each column index.</text>
</svg>
