<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Default flat Mito SST layout</title>
  <desc id="desc">Mito records file-level metadata for a Parquet SST. Each row group stores optional raw primary-key columns, field columns, the time index, the encoded primary key, sequence, and operation type.</desc>
  <defs>
    <style>
      .group { font: 650 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .title { font: 650 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .label { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .amber { fill: #B45309; }
      .purple { fill: #6D28D9; }
      .teal { fill: #0F766E; }
      .blue { fill: #1D4ED8; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#FFFFFF"/>

  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="70" y="64" class="title">SST metadata</text>
  <text x="70" y="91" class="small">time range · primary-key range · rows · row groups · indexes</text>

  <rect x="40" y="140" width="1120" height="240" rx="18" fill="#FAFAFF" stroke="#C4B5FD" stroke-width="2.5"/>
  <text x="70" y="176" class="group">Parquet SST</text>

  <rect x="70" y="200" width="1060" height="105" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="90" y="238" class="title">Row group 0</text>

  <rect x="220" y="220" width="185" height="64" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="312.5" y="247" text-anchor="middle" class="label amber">Raw PK columns</text>
  <text x="312.5" y="271" text-anchor="middle" class="small">optional</text>

  <rect x="425" y="220" width="145" height="64" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="497.5" y="247" text-anchor="middle" class="label purple">Fields</text>
  <text x="497.5" y="271" text-anchor="middle" class="mono">cpu · memory</text>

  <rect x="590" y="220" width="120" height="64" rx="10" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2"/>
  <text x="650" y="247" text-anchor="middle" class="label teal">Time</text>
  <text x="650" y="271" text-anchor="middle" class="mono">ts</text>

  <rect x="730" y="220" width="160" height="64" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="810" y="247" text-anchor="middle" class="label blue">Encoded key</text>
  <text x="810" y="271" text-anchor="middle" class="mono">__primary_key</text>

  <rect x="910" y="220" width="210" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1015" y="247" text-anchor="middle" class="label">Merge metadata</text>
  <text x="1015" y="271" text-anchor="middle" class="mono">__sequence · __op_type</text>

  <rect x="70" y="330" width="1060" height="36" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="354" text-anchor="middle" class="small">… Row group n</text>
</svg>
