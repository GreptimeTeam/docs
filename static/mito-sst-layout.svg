<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Mito Parquet SST layout</title>
  <desc id="desc">Mito records file-level metadata for a Parquet SST and divides the file into independently readable row groups. Row groups store field columns, the time index, the encoded primary key, sequence, and operation type, plus raw primary-key columns when the selected encoding includes them. An SST is not shown as belonging to exactly one compaction time window because a file can span windows.</desc>
  <defs>
    <style>
      .kicker { font: 650 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; text-transform: uppercase; fill: #64748B; }
      .headline { font: 650 31px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .title { font: 650 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .label { font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .amber { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #B45309; }
      .purple { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #6D28D9; }
      .teal { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F766E; }
      .blue { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1D4ED8; }
    </style>
  </defs>

  <rect width="1500" height="800" fill="#FFFFFF"/>
  <text x="70" y="58" class="kicker">Default flat SST layout</text>
  <text x="70" y="101" class="headline">A Parquet SST stores table columns with Mito merge metadata</text>
  <line x1="70" y1="126" x2="1430" y2="126" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="70" y="165" width="1360" height="105" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="105" y="205" class="title">Mito SST metadata</text>
  <text x="105" y="239" class="subtitle">time range · primary-key range · row count · row-group count · available indexes</text>

  <rect x="70" y="305" width="1360" height="370" rx="20" fill="#FAFAFF" stroke="#C4B5FD" stroke-width="2.5"/>
  <text x="105" y="348" class="title">Parquet SST</text>
  <text x="105" y="378" class="subtitle">row groups are the independently readable and skippable units</text>

  <rect x="105" y="415" width="1290" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="135" y="456" class="title">Row group 0</text>
  <rect x="300" y="435" width="230" height="64" rx="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="415" y="461" text-anchor="middle" class="amber">Raw primary-key columns</text>
  <text x="415" y="484" text-anchor="middle" class="small">when present</text>
  <rect x="550" y="435" width="170" height="64" rx="11" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="635" y="461" text-anchor="middle" class="purple">Field columns</text>
  <text x="635" y="484" text-anchor="middle" class="mono">cpu · memory</text>
  <rect x="740" y="435" width="135" height="64" rx="11" fill="#ECFDF5" stroke="#2DD4BF" stroke-width="2"/>
  <text x="807.5" y="461" text-anchor="middle" class="teal">Time index</text>
  <text x="807.5" y="484" text-anchor="middle" class="mono">ts</text>
  <rect x="895" y="435" width="205" height="64" rx="11" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="997.5" y="461" text-anchor="middle" class="blue">Encoded key</text>
  <text x="997.5" y="484" text-anchor="middle" class="mono">__primary_key</text>
  <rect x="1120" y="435" width="245" height="64" rx="11" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1242.5" y="461" text-anchor="middle" class="label">Merge metadata</text>
  <text x="1242.5" y="484" text-anchor="middle" class="mono">__sequence · __op_type</text>

  <rect x="105" y="545" width="1290" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="135" y="583" class="title">Row group 1</text>
  <text x="300" y="583" class="subtitle">the same physical columns, containing the next independently readable group of rows</text>
  <rect x="1120" y="563" width="245" height="50" rx="25" fill="#EDE9FE"/>
  <text x="1242.5" y="594" text-anchor="middle" class="purple">column min / max / null count</text>

  <line x1="70" y1="718" x2="1430" y2="718" stroke="#E2E8F0" stroke-width="2"/>
  <text x="70" y="752" class="label">Ordering:</text>
  <text x="165" y="752" class="small">for tables with primary keys, rows are ordered by primary key and then by time index.</text>
  <text x="870" y="752" class="label">Compaction:</text>
  <text x="995" y="752" class="small">an SST may span more than one compaction time window.</text>
</svg>
