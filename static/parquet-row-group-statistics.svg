<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Parquet row-group pruning with column statistics</title>
  <desc id="desc">For the predicate name equals Emily, row group 0 can be skipped because its maximum name is Charlie. Row group 1 must be read because Emily falls between its minimum value Doug and maximum value John.</desc>
  <defs>
    <style>
      .group { font: 650 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .title { font: 650 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .label { font: 600 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #334155; }
      .red { fill: #B91C1C; }
      .teal { fill: #0F766E; }
      .purple { fill: #6D28D9; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#FFFFFF"/>

  <rect x="40" y="155" width="260" height="100" rx="15" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="70" y="192" class="label purple">Predicate</text>
  <text x="70" y="229" class="mono">name = "Emily"</text>

  <path d="M 310 205 L 370 205" fill="none" stroke="#94A3B8" stroke-width="2.5"/>
  <path d="M 370 205 L 358 198 L 358 212 Z" fill="#94A3B8"/>
  <text x="340" y="190" text-anchor="middle" class="small">min / max</text>

  <rect x="380" y="35" width="780" height="350" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="415" y="72" class="group">Parquet metadata</text>

  <rect x="420" y="95" width="700" height="115" rx="14" fill="#FFF7F7" stroke="#FCA5A5" stroke-width="2.5"/>
  <text x="450" y="137" class="title">Row group 0</text>
  <rect x="620" y="118" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="645" y="156" class="label">name</text>
  <text x="720" y="156" class="mono">Alice … Charlie</text>
  <rect x="970" y="118" width="115" height="62" rx="31" fill="#FEE2E2"/>
  <text x="1027.5" y="156" text-anchor="middle" class="title red">Skip</text>

  <rect x="420" y="240" width="700" height="115" rx="14" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2.5"/>
  <text x="450" y="282" class="title">Row group 1</text>
  <rect x="620" y="263" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="645" y="301" class="label">name</text>
  <text x="720" y="301" class="mono">Doug … John</text>
  <rect x="970" y="263" width="115" height="62" rx="31" fill="#CCFBF1"/>
  <text x="1027.5" y="301" text-anchor="middle" class="title teal">Read</text>
</svg>
